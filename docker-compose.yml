# UniRig API — GPU inference service
#
# Prerequisites:
#   - NVIDIA GPU + nvidia-container-toolkit
#   - Checkpoints in ./ckpts (run: make ckpts)
#
# Usage:
#   docker compose up -d
#   curl http://localhost:8080/health

services:
  unirig:
    image: unirig-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./ckpts:/app/experiments:ro
    environment:
      - PORT=8080
      - UNIRIG_APP_DIR=/app
      - UNIRIG_COMPILE=${UNIRIG_COMPILE:-0}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-graphics,compute,utility}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
