mode: predict
debug: False
experiment_name: quick_inference_skeleton_rignet
resume_from_checkpoint: experiments/skeleton/rignet/model.ckpt

components:
  data: quick_inference
  tokenizer: tokenizer_rignet
  transform: inference_ar_transform
  model: unirig_rignet
  system: ar_inference_rignet
  data_name: raw_data.npz

writer:
  __target__: ar
  output_dir: ~
  add_num: False
  repeat: 1
  export_npz: predict_skeleton

trainer:
  max_epochs: 1
  num_nodes: 1
  devices: 1
  precision: bf16-mixed
  accelerator: gpu
  strategy: auto
