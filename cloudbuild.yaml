# Cloud Build config for UniRig
#
# Builds a shared base image first, then the API image on top.
# Uses BuildKit (DOCKER_BUILDKIT=1) for cache mounts (apt, uv).
# The base layer (CUDA + Python + PyTorch + checkpoints) is cached in the registry
# so code-only changes rebuild in seconds.
#
# API (production):
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_REGION=us-central1

steps:
  # ── Step 1: Pull existing images for cache (parallel, fail-ok) ──
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull ${_BASE_IMAGE} || true'
    id: pull-base

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull ${_IMAGE} || true'
    id: pull-service
    waitFor: ['-']   # run in parallel with pull-base

  # ── Step 2: Build the shared base image (BuildKit for cache mounts) ──
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.base'
      - '--cache-from=${_BASE_IMAGE}'
      - '-t'
      - '${_BASE_IMAGE}'
      - '.'
    timeout: 3600s
    waitFor: ['pull-base']
    id: build-base

  # ── Step 3: Build the API image on top of the base ──
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-f'
      - '${_DOCKERFILE}'
      - '--build-arg'
      - 'BASE_IMAGE=${_BASE_IMAGE}'
      - '--cache-from=${_IMAGE}'
      - '-t'
      - '${_IMAGE}'
      - '.'
    timeout: 600s
    waitFor: ['pull-service', 'build-base']
    id: build-service

images:
  - '${_BASE_IMAGE}'
  - '${_IMAGE}'

substitutions:
  _SERVICE: 'api'
  _DOCKERFILE: 'Dockerfile'
  _REGION: 'us-central1'
  _BASE_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/unirig/unirig-base:latest'
  _IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/unirig/unirig-${_SERVICE}:latest'

options:
  machineType: 'E2_HIGHCPU_32'
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true

timeout: 4800s
